<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>TABIBK | طبيبي</title>

    <meta name="description"
        content="TABIBK - منصة حجز المواعيد الطبية">

    <link rel="stylesheet" href="style.css">

    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>

<body>

<!-- ================= HEADER ================= -->

<header class="header">

    <div class="container header-inner">

        <a href="#home" class="brand">

            <div class="brand-icon">
                <i class="fa-solid fa-plus"></i>
            </div>

            <div class="brand-name">
                <strong>TABIBK</strong>
                <span>طبيبي</span>
            </div>

        </a>


        <nav class="desktop-menu">

            <a href="#home" class="active">الرئيسية</a>
            <a href="#specialties">التخصصات</a>
            <a href="#doctors">الأطباء</a>
            <a href="#how">كيف يعمل؟</a>

        </nav>


        <div class="header-actions">

            <button class="login-button" id="loginButton">
                <i class="fa-regular fa-user"></i>
                <span>دخول</span>
            </button>

            <button class="gold-button" id="headerBookingButton">
                حجز موعد
            </button>

        </div>

    </div>

</header>


<!-- ================= MAIN ================= -->

<main id="home">


<!-- ================= HERO ================= -->

<section class="hero">

    <div class="container hero-box">

        <div class="hero-content">

            <div class="hero-label">
                <span></span>
                منصة طبية جزائرية
            </div>


            <h1>
                طبيبك أقرب إليك
                <br>
                <strong>احجز موعدك بسهولة</strong>
            </h1>


            <p>
                ابحث عن طبيبك، اختر التخصص والموعد المناسب
                واحصل على تأكيد حجزك بكل سهولة.
            </p>


            <!-- SEARCH -->

            <form class="search-form" id="searchForm">

                <div class="search-input">

                    <i class="fa-solid fa-user-doctor"></i>

                    <input
                        type="text"
                        id="doctorSearch"
                        placeholder="اسم الطبيب أو التخصص">

                </div>


                <div class="search-input">

                    <i class="fa-solid fa-location-dot"></i>

                    <input
                        type="text"
                        id="locationSearch"
                        placeholder="الولاية أو البلدية">

                </div>


                <button type="submit" class="search-button">

                    <i class="fa-solid fa-magnifying-glass"></i>

                    بحث

                </button>

            </form>


            <!-- STATS -->

            <div class="stats">

                <div>
                    <strong>+500</strong>
                    <span>طبيب</span>
                </div>

                <div>
                    <strong>+20</strong>
                    <span>تخصص</span>
                </div>

                <div>
                    <strong>+10K</strong>
                    <span>موعد</span>
                </div>

            </div>

        </div>


        <!-- HERO CARD -->

        <div class="hero-visual">

            <div class="medical-logo">

                <div class="medical-plus">
                    +
                </div>

            </div>


            <div class="hero-doctor-card">

                <div class="doctor-avatar">
                    <i class="fa-solid fa-user-doctor"></i>
                </div>

                <div class="hero-doctor-info">

                    <strong>طبيب متخصص</strong>

                    <span>طب عام</span>

                    <div class="stars">
                        ★★★★★
                        <small>4.9</small>
                    </div>

                </div>

                <i class="fa-solid fa-circle-check verified"></i>

            </div>


            <div class="confirmation-card">

                <div class="confirmation-icon">
                    <i class="fa-solid fa-calendar-check"></i>
                </div>

                <div>
                    <strong>تم تأكيد الموعد</strong>
                    <span>اليوم • 10:30</span>
                </div>

            </div>

        </div>

    </div>

</section>


<!-- ================= SPECIALTIES ================= -->

<section class="section" id="specialties">

    <div class="container">

        <div class="section-heading">

            <div>
                <span>التخصصات الطبية</span>
                <h2>اختر تخصصك</h2>
            </div>

            <button class="text-button" id="allSpecialties">
                عرض الكل
                <i class="fa-solid fa-arrow-left"></i>
            </button>

        </div>


        <div class="specialties-grid">

            <button class="specialty-card" data-specialty="أمراض القلب">

                <div class="specialty-icon red">
                    <i class="fa-solid fa-heart-pulse"></i>
                </div>

                <strong>أمراض القلب</strong>
                <span>اختصاصيون</span>

            </button>


            <button class="specialty-card" data-specialty="طب الأسنان">

                <div class="specialty-icon blue">
                    <i class="fa-solid fa-tooth"></i>
                </div>

                <strong>طب الأسنان</strong>
                <span>اختصاصيون</span>

            </button>


            <button class="specialty-card" data-specialty="طب العيون">

                <div class="specialty-icon purple">
                    <i class="fa-solid fa-eye"></i>
                </div>

                <strong>طب العيون</strong>
                <span>اختصاصيون</span>

            </button>


            <button class="
